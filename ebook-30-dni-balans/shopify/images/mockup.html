<!DOCTYPE html>
<html lang="bg"><head><meta charset="utf-8">
<style>
@import url('../book/fonts.css');
html,body{margin:0;padding:0;background:transparent;font-family:'Manrope',sans-serif;font-feature-settings:"locl" 0;}
.book{position:relative;transform-style:preserve-3d;}
.book .front{position:absolute;inset:0;border-radius:2px 6px 6px 2px;overflow:hidden;}
.book .front img{display:block;width:100%;height:100%;object-fit:cover;}
.book .front::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18) 0,rgba(255,255,255,.18) 1.2%,rgba(0,0,0,.06) 2.6%,rgba(255,255,255,0) 5%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%);}
.book .pages{position:absolute;top:1.2%;height:97.6%;
  background:repeating-linear-gradient(90deg,#fff 0,#fff 2px,#ece6e8 2px,#ece6e8 3px);}
.book .back{position:absolute;inset:0;background:#3B1028;border-radius:2px 6px 6px 2px;}

/* ===== product image 800x800 ===== */
#prod{width:800px;height:800px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#FFF6F9 0,#FBE3EC 45%,#F2C4D5 100%);}
#prod .floor{position:absolute;left:150px;right:150px;bottom:92px;height:60px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(86,28,59,.38) 0,rgba(86,28,59,0) 70%);filter:blur(6px);}
#prod .persp{position:absolute;left:0;right:0;top:70px;height:620px;perspective:1500px;display:flex;justify-content:center;}
#prod .book{width:430px;height:608px;transform:rotateY(-26deg) rotateX(2deg);}
#prod .book .front{transform:translateZ(22px);box-shadow:16px 18px 40px rgba(59,16,40,.28);}
#prod .book .pages{width:42px;left:0;transform:translateX(409px) rotateY(90deg);}
#prod .book .back{transform:translateZ(-22px);box-shadow:-10px 0 50px 6px rgba(59,16,40,.35);}
#prod .badge{position:absolute;right:56px;top:56px;width:168px;height:168px;border-radius:50%;background:#561C3B;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 28px rgba(59,16,40,.35);transform:rotate(10deg);}
#prod .badge b{font-size:27px;font-weight:800;letter-spacing:.06em;line-height:1.05}
#prod .badge span{font-size:15px;font-weight:700;color:#F2B8CC;margin-top:6px;line-height:1.2}
#prod .chips{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;gap:10px}
#prod .chips span{background:#fff;color:#561C3B;font-weight:800;font-size:17px;padding:9px 16px;border-radius:30px;box-shadow:0 4px 14px rgba(86,28,59,.12)}

/* ===== tier thumbnail (transparent) ===== */
#thumb{width:300px;height:300px;position:relative;}
#thumb .persp{position:absolute;inset:0;perspective:900px;display:flex;align-items:center;justify-content:center;}
#thumb .book{width:186px;height:263px;transform:rotateY(-28deg);margin-left:-10px}
#thumb .book .front{transform:translateZ(11px);box-shadow:8px 10px 18px rgba(59,16,40,.25);}
#thumb .book .pages{width:21px;left:0;transform:translateX(175px) rotateY(90deg);}
#thumb .book .back{transform:translateZ(-11px);box-shadow:-6px 0 22px 3px rgba(59,16,40,.3);}
</style></head>
<body>
<div id="prod">
  <div class="floor"></div>
  <div class="persp"><div class="book"><div class="back"></div><div class="pages"></div><div class="front"><img src="cover.jpg"></div></div></div>
  <div class="badge"><b>ПОДАРЪК</b><span>към 2+1<br>и 3+2</span></div>
  <div class="chips"><span>PDF · 35 страници</span><span>30-дневен план</span><span>10 рецепти</span></div>
</div>
<div style="height:20px"></div>
<div id="thumb">
  <div class="persp"><div class="book"><div class="back"></div><div class="pages"></div><div class="front"><img src="cover.jpg"></div></div></div>
</div>
</body></html>
