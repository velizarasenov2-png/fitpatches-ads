/* ---------- Запис в Google Sheets ---------- */
function payload(event, step) {
  // В таблицата записваме текста на отговора (по-лесно за четене), не кода.
  var a = {};
  Object.keys(st.a).forEach(function (k) {
    a[k] = (Array.isArray(st.a[k]) ? st.a[k] : [st.a[k]]).map(function (v) {
      if (v === 'skip') return 'Пропуснато';
      var o = LABELS[k + ':' + v]; return o ? o.t + (o.s ? ' — ' + o.s : '') : v;
    }).join(' | ');
  });
  var qs = questions(), maxStep = 0;
  qs.forEach(function (s, n) { if (st.a[s.id] !== undefined) maxStep = n + 1; });
  return {
    qid: st.qid, event: event, step_id: step || '', max_step: maxStep, steps_total: qs.length,
    seconds: Math.round((Date.now() - st.t0) / 1000),
    angle: ANGLE, utm_source: P.utm_source || '', utm_medium: P.utm_medium || '', utm_campaign: P.utm_campaign || '',
    utm_content: P.utm_content || '', utm_term: P.utm_term || '', fbclid: P.fbclid ? 'yes' : '',
    device: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
    referrer: (document.referrer || '').split('?')[0].slice(0, 120),
    profile: st.a.obstacle ? profile().name : '', recommended_pack: st.a.commit ? pack() : '',
    answers: a, version: CONFIG.VERSION
  };
}
function send(event, step) {
  var body = JSON.stringify(payload(event, step));
  if (P.debug) console.log('[quiz]', event, JSON.parse(body));
  if (!CONFIG.SHEET_URL) return;
  try {
    fetch(CONFIG.SHEET_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
  } catch (e) {
    try { navigator.sendBeacon(CONFIG.SHEET_URL, new Blob([body], { type: 'text/plain' })); } catch (e2) {}
  }
}
function sendOnce(event, step) { if (st.sent[event]) return; st.sent[event] = 1; save(); send(event, step); }

    html += '<div class="info-ico">🤝</div><h2 class="q">' + esc(head) + '</h2>' +
      '<p class="hint">Хиляди българи вече овладяха апетита си с FitPatches — без диети и без хапчета.</p>' +
      '<div class="card"><div class="rating"><div class="rating__num">' + CONFIG.RATING + '</div><div><div class="stars">★★★★★</div><div class="rating__txt">от ' + CONFIG.REVIEWS + ' доволни клиенти</div></div></div>' +
      quote(p.proof) + '</div>';
  }
  html += '<div class="actions"><button class="btn" id="go" type="button">Продължи</button></div></section>';
  app.innerHTML = html;
  document.getElementById('go').onclick = next;
}

function quote(q) {
  return '<div class="quote"><img src="' + IMG + q.img + '?width=100" alt="" width="46" height="46"><div><div class="stars" style="font-size:13px">★★★★★</div><blockquote>„' + esc(q.t) + '“</blockquote><cite>' + esc(q.n) + ' · проверен клиент</cite></div></div>';
}

function renderLoading() {
  var items = ['Анализираме отговорите ти', 'Определяме типа на глада ти', 'Избираме подходящия подход', 'Подготвяме персоналния ти план'];
  app.innerHTML = '<section class="screen loader"><h2 class="q" style="margin-top:0">' + (st.a.name ? esc(st.a.name) + ', подготвяме' : 'Подготвяме') + ' твоя резултат…</h2>' +
    '<div class="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" fill="none" stroke="#fbe9f1" stroke-width="12"/><circle id="arc" cx="75" cy="75" r="66" fill="none" stroke="#d64d87" stroke-width="12" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="414.7"/></svg><div class="ring__pct" id="pct">0%</div></div>' +
    '<ul class="checks">' + items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></section>';
  var arc = document.getElementById('arc'), pctEl = document.getElementById('pct'), lis = app.querySelectorAll('.checks li');
  var dur = 4200, t0 = performance.now();
  (function tick(now) {
    var k = Math.min(1, (now - t0) / dur), v = Math.round(k * 100);
    arc.setAttribute('stroke-dashoffset', String(414.7 * (1 - k)));
    pctEl.textContent = v + '%';
    Array.prototype.forEach.call(lis, function (li, n) { if (k >= (n + 1) / (lis.length + .3)) li.classList.add('done'); });
    if (k < 1) requestAnimationFrame(tick); else setTimeout(function () { st.i = idx('result'); save(); render(); window.scrollTo(0, 0); }, 350);
  })(t0);
}

function productUrl() {
  var u;
  try { u = new URL(CONFIG.PRODUCT_URL); } catch (e) { return CONFIG.PRODUCT_URL; }
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid'].forEach(function (k) { if (P[k]) u.searchParams.set(k, P[k]); });
  if (!P.utm_source) u.searchParams.set('utm_source', 'quiz');
  u.searchParams.set('qid', st.qid);          // свързва поръчката с отговорите (виж README)
  u.searchParams.set('qp', profile().code);    // неутрален код на профила (без здравни думи)
  u.searchParams.set('qpk', pack());           // препоръчан пакет: 1 / 3 / 5
  return u.toString();
}

function renderResult() {
  var p = profile(), k = pack(), PK = CONFIG.PACKS[k], name = st.a.name;
  var preg = has('health', 'preg'), meds = has('health', 'meds');
  var tried = st.a.tried || [];
  sendOnce('complete', 'result'); if (!st.sent.px) { st.sent.px = 1; save(); pixel(CONFIG.PIXEL_EVENTS.complete); }

  // Защо FitPatches — според отговорите
  var why = ['Една лепенка сутрин — без диети, без хапчета, без броене на калории', p.why];
  if (tried.indexOf('kapsuli') > -1) why.push('Не минава през стомаха като капсулите — без тежест и подуване');
  else if (tried.indexOf('hapcheta') > -1) why.push('Без стимуланти и без хапчета — натурален берберин през кожата');
  else if (tried.indexOf('dieti') > -1 || tried.indexOf('dietolog') > -1) why.push('Не е нужна строга диета — просто ядеш по-малко, без да се измъчваш');
  else why.push('Подава берберин постепенно през кожата през целия ден');
  if (has('hunger_time', 'vecher') || has('hunger_time', 'nosht')) why.push('Помага гладът да е по-равномерен — и вечерите стават по-лесни');

  var facts = [];
  if (st.a.kg) facts.push(['Цел', label('kg', st.a.kg)]);
  if (st.a.zone) facts.push(['Проблемна зона', label('zone', st.a.zone)]);
  if (st.a.hunger_time) facts.push(['Най-силен глад', label('hunger_time', st.a.hunger_time)]);
  if (st.a.duration) facts.push(['Опитваш от', label('duration', st.a.duration).toLowerCase()]);
  var triedTxt = tried.filter(function (x) { return x !== 'nishto'; }).map(function (x) { return label('tried', x).replace(/ \(.*\)/, ''); }).join(', ');

  var plan = [
    ['Дни 1 – 7', 'Свикваш с лепенката — една сутрин и забравяш за нея. Много клиенти усещат по-малко желание за сладко още тогава.'],
    ['Седмица 2 – 4', 'Апетитът става по-стабилен. Порциите намаляват естествено, без да се измъчваш.'],
    ['Седмица 4 – 8', 'Започваш да виждаш промяна — в дрехите, в огледалото, на кантара.']
  ];
  if (k !== '1') plan.push(['Месец 3' + (k === '5' ? ' – 5' : ''), 'Новият апетит се превръща в навик — така резултатът се задържа, вместо да се връща.']);

  var html = '<section class="screen">' +
    '<div style="padding-top:12px"><span class="pill">✨ Твоят резултат е готов</span></div>' +
    '<h1 class="h1" style="font-size:25px">' + (name ? esc(name) + ', ето' : 'Ето') + ' какво показаха отговорите ти</h1>' +
    '<div class="res-type"><div class="res-type__ico">' + p.ico + '</div><div class="res-type__lbl">Твоят тип</div><div class="res-type__name">' + p.name + '</div><div class="res-type__txt">' + esc(p.txt) + '</div></div>';

  if (facts.length) {
    html += '<h2 class="h2">Твоят профил</h2><ul class="facts">' + facts.map(function (f) { return '<li><b>' + f[0] + '</b><span>' + esc(f[1]) + '</span></li>'; }).join('') +
      (triedTxt ? '<li class="wide"><b>Вече ' + g('пробвала', 'пробвал') + '</b><span>' + esc(triedTxt) + '</span></li>' : '') + '</ul>';
  }

  if (preg) {
    html += '<div class="note"><b>Важно:</b> По време на бременност и кърмене не препоръчваме FitPatches без одобрение от лекар. Запази си резултата и се върни към него, когато е подходящо. 💗</div>' +
      '<p class="disclaimer">Тестът има информативен характер и не е медицинска диагноза. FitPatches не е лекарство.</p></section>';
    app.innerHTML = html; return;
  }

  html += '<h2 class="h2">Решението за теб</h2>' +
    '<div class="card"><div class="prod"><img src="' + IMG + 'fitpatches_2048_no_white_background.png?width=300" alt="FitPatches берберинови лепенки" width="96" height="96"><div><div class="prod__name">FitPatches берберинови лепенки</div><div class="prod__sub">За ' + (p.code === 'p1' ? 'метаболитен баланс и ' : '') + 'овладян апетит — без диети и без хапчета</div></div></div>' +
    '<ul class="why" style="margin-top:14px">' + why.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>';

  if (meds) html += '<div class="note"><b>Приемаш лекарства:</b> Преди да започнеш, консултирай се с личния си лекар — особено при лекарства за кръвна захар (напр. метформин), тъй като берберинът също влияе на нивата ѝ.</div>';

  html += '<h2 class="h2">Твоят план</h2><ul class="plan">' + plan.map(function (x) { return '<li><b>' + x[0] + '</b><span>' + x[1] + '</span></li>'; }).join('') + '</ul>';

  var bigGoal = (st.a.kg === '10-20' || st.a.kg === '20+') && k === '1';
  html += '<h2 class="h2">Препоръчан пакет за теб</h2>' +
    '<div class="offer"><span class="offer__badge">ИЗБРАН СПОРЕД ОТГОВОРИТЕ ТИ</span><div class="offer__row"><div><div class="offer__name">' + PK.name + '</div><div class="offer__meta">' + PK.meta + '</div></div>' +
    '<div class="offer__price"><div class="offer__new">' + PK.price + '</div><div class="offer__old">' + PK.old + '</div><div class="offer__day">' + PK.day + '</div></div></div>' +
    '<div class="offer__note">' + (bigGoal ? 'При цел над 10 кг повечето клиенти избират пакета за 3 месеца — ' : '') + 'Ще можеш да смениш пакета на следващата стъпка.</div></div>' +
    '<div class="actions"><a class="btn" id="cta" href="' + esc(productUrl()) + '">Към моя пакет →</a></div>' +
    '<div class="perks"><span>Плащане при доставка</span><span>Доставка 2–4 работни дни</span>' + (CONFIG.GUARANTEE ? '<span>' + CONFIG.GUARANTEE + '</span>' : '') + '</div>';

  var others = Object.keys(PROFILES).filter(function (x) { return PROFILES[x] !== p; }).slice(0, 1).map(function (x) { return PROFILES[x].proof; });
  html += '<h2 class="h2">Какво казват клиентите</h2><div class="card">' + quote(p.proof) + others.map(quote).join('') + '</div>' +
    '<div class="actions" style="margin-top:22px"><a class="btn" href="' + esc(productUrl()) + '" data-cta="2">Започни своя план →</a></div>' +
    '<p class="disclaimer">Тестът има информативен характер и не е медицинска диагноза. FitPatches не е лекарство и не е предназначен за диагностика или лечение на заболявания. Резултатите са индивидуални. При бременност, кърмене, хронично заболяване или прием на лекарства се консултирай с лекар преди употреба.</p></section>';
  app.innerHTML = html;

  var url = productUrl();
  floatBtn.setAttribute('href', url);
  var onCta = function () { send('cta', 'result'); if (!st.sent.pxc) { st.sent.pxc = 1; save(); pixel(CONFIG.PIXEL_EVENTS.cta); } };
  Array.prototype.forEach.call(document.querySelectorAll('#cta,[data-cta],#floatBtn'), function (a) { a.addEventListener('click', onCta); });
  var cta = document.getElementById('cta');
  var onScroll = function () { var r = cta.getBoundingClientRect(), inView = r.top < window.innerHeight && r.bottom > 0; floatcta.classList.toggle('show', window.scrollY > 300 && !inView); };
  window.addEventListener('scroll', onScroll, { passive: true });
}

if (!st.sent.view) sendOnce('view', '');
render();
</script>
</body>
</html>
