<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>FitPatches Черен петък — Три думи</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
  :root {
    --bg: #121212;
    --ink: #ffffff;
    --accent: #ea7e7e;
    --muted: #8c8c8c;
    --pad: 72px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); }
  .ad {
    position: relative;
    width: 1080px; height: 1350px;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  .ad {
    display: flex; flex-direction: column;
    padding: 96px 56px 0 var(--pad);
  }
  .tag {
    align-self: flex-start;
    font-family: 'Oswald', sans-serif; font-weight: 600;
    font-size: 30px; letter-spacing: 3px; line-height: 1;
    color: var(--bg); background: var(--accent);
    padding: 12px 18px 13px;
  }
  h1 {
    margin-top: 72px;
    font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 138px; line-height: 1.16; letter-spacing: 0;
    text-transform: uppercase; white-space: nowrap;
  }
  .sub {
    margin-top: 64px; width: 880px;
    font-family: 'Roboto', sans-serif; font-weight: 400;
    font-size: 42px; line-height: 1.3; color: var(--accent);
  }
  .rule {
    margin-top: 44px;
    height: 3px; background: var(--accent);
  }
  .brand {
    margin-top: auto;
    display: flex; align-items: baseline; gap: 26px;
  }
  .brand .name {
    position: relative;
    font-family: 'Roboto', sans-serif; font-weight: 500;
    font-size: 72px; letter-spacing: -1px; line-height: 1;
  }
  .brand .name::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -14px;
    height: 9px; background: linear-gradient(90deg, #d9656b, #f6a3a3);
  }
  .brand .price {
    font-family: 'Roboto', sans-serif; font-weight: 500;
    font-size: 44px; color: var(--accent);
  }
  .brand .old {
    font-family: 'Roboto', sans-serif; font-weight: 400;
    font-size: 34px; color: var(--muted); text-decoration: line-through;
  }
  .fine {
    margin-top: 40px; margin-bottom: 150px;
    font-family: 'Roboto', sans-serif; font-weight: 400;
    font-size: 30px; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="ad">
    <div class="tag">ЧЕРЕН ПЕТЪК · ДО −46%</div>
    <h1>Упорити паласки.<br>Тесни дънки.<br>Йо-йо ефект.</h1>
    <p class="sub">Това е животът след 40 без подкрепа за метаболизма. Тялото ти не може да кара на диети и воля вечно.</p>
    <div class="rule"></div>
    <div class="brand">
      <span class="name">FitPatches</span>
      <span class="price">€0,27 / ден</span>
      <span class="old">€0,50</span>
    </div>
    <p class="fine">3+2 подарък · 150 лепенки · 30 дни гаранция</p>
  </div>
  <script>
    // Fit the headline so its widest line spans ~92% of the content width.
    document.fonts.ready.then(() => {
      const h = document.querySelector('h1');
      const max = 0.92 * (1080 - 72 - 56);
      const size = parseFloat(getComputedStyle(h).fontSize);
      h.style.fontSize = (size * max / h.scrollWidth) + 'px';
      document.body.dataset.ready = '1';
    });
  </script>
</body>
</html>
