<!DOCTYPE html><html lang="bg"><head><meta charset="utf-8">
<style>
 body{margin:0;width:1420px;height:1000px;font-family:Inter,Helvetica,Arial,sans-serif;background:#fbf3f6;color:#1d1d1f;overflow:hidden}
 .top{background:#f0c6dc;text-align:center;padding:20px 0;font:700 52px Georgia,serif;letter-spacing:-1px;color:#2b1520}
 .card{display:flex;gap:44px;align-items:center;margin:40px 48px;background:#fff;border-radius:32px;padding:40px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
 .card img{width:520px;height:640px;object-fit:cover;border-radius:22px}
 h1{font-size:44px;line-height:1.15;margin:0 0 10px}
 .sub{color:#777;font-size:28px}
 .price{font-size:84px;font-weight:800;margin:26px 0 0}
 .old{color:#999;text-decoration:line-through;font-size:36px;margin-left:16px;font-weight:500}
 .day{color:#d6337a;font-weight:700;font-size:30px;margin-top:6px}
 .btn{margin:34px 0 16px;background:#28a745;color:#fff;border-radius:20px;padding:30px;font-size:44px;font-weight:800;text-align:center}
 .cod{color:#666;font-size:26px;text-align:center}
</style></head><body>
<div class="top">FitPatches</div>
<div class="card">
 <img src="product.jpg">
 <div>
  <h1>Берберинови лепенки FitPatches</h1>
  <div class="sub">30 лепенки · за 1 месец</div>
  <div class="price">14,99 €<span class="old">29,99 €</span></div>
  <div class="day">при 3+2 подарък — 0,27 € на ден</div>
  <div class="btn">ПОРЪЧАЙ СЕГА</div>
  <div class="cod">Плащане при доставка · Без предплащане</div>
 </div>
</div>
</body></html>
